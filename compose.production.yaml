name: ${COMPOSE_PROJECT_NAME:-dekstra-monolith}

x-app: &app
  image: ${APP_IMAGE:-dekstra-backend:latest}
  build:
    context: .
  env_file:
    - path: ${ENV_FILE:-.env.production}
      required: true
  environment:
    DJANGO_OTP_EXPOSE_IN_RESPONSE: ${DJANGO_OTP_EXPOSE_IN_RESPONSE:-true}
    POSTGRES_HOST: db
    POSTGRES_PORT: 5432
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: django-db
  volumes:
    - media_data:/app/media
    - static_data:/app/staticfiles
  tmpfs:
    - /tmp:size=512m,mode=1777
  init: true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  db:
    image: postgres:16-alpine
    env_file:
      - path: ${ENV_FILE:-.env.production}
        required: true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 256mb
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1000"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  migrate:
    <<: *app
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  web:
    <<: *app
    command:
      - sh
      - -c
      - >
        exec gunicorn dekstra.wsgi:application
        --bind 0.0.0.0:8000
        --workers "$${GUNICORN_WORKERS:-8}"
        --timeout "$${GUNICORN_TIMEOUT:-120}"
        --access-logfile -
        --error-logfile -
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker:
    <<: *app
    command:
      - sh
      - -c
      - >
        exec celery -A dekstra worker
        --loglevel=info
        --concurrency="$${CELERY_WORKER_CONCURRENCY:-2}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    stop_grace_period: 60s

  beat:
    <<: *app
    command:
      - celery
      - -A
      - dekstra
      - beat
      - --loglevel=info
      - --scheduler
      - django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
